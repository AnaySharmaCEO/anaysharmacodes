<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Under Maintenance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #0e0e0e;
      color: #ffffff;
      text-align: center;
    }
    .container {
      max-width: 420px;
      padding: 20px;
    }
    h1 {
      font-size: 2.1rem;
      margin-bottom: 0.6rem;
    }
    h2 {
      font-size: 1.2rem;
      font-weight: normal;
      opacity: 0.85;
      margin-bottom: 1.2rem;
    }
    p {
      font-size: 0.95rem;
      opacity: 0.7;
    }
    .brand {
      margin-top: 2rem;
      font-size: 0.9rem;
      letter-spacing: 1px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Website Under Maintenance</h1>
    <h2>We're making a few improvements.</h2>
    <p>Grab a coffee - we'll be back shortly.</p>
    <div class="brand">- Anay Sharma</div>
  </div>
</body>
</html>
